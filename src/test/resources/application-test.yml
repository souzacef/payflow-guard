spring:
  datasource:
    url: jdbc:h2:mem:payflowguard-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  security:
    jwt:
      secret: "test-only-payflow-guard-jwt-signing-key-1234567890"

  scheduling:
    enabled: false

  webhooks:
    payment-status-url: "disabled://tests"
